services:
  stickerer:
    # Prebuilt image from GitHub Container Registry (built by .github/workflows/docker.yml).
    # To build locally instead, comment out `image` and keep `build`.
    image: ghcr.io/broemp/stickerer:main
    build: .
    container_name: stickerer
    ports:
      - "${PORT:-3000}:3000"
    # Behind an HTTPS reverse proxy, set the public URL (SvelteKit rejects POSTs otherwise):
    # environment:
    #   ORIGIN: https://stickers.example.com
    # Converted stickers are cached in /tmp; keep the container filesystem read-only otherwise.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
