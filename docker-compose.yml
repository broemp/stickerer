services:
  stickerer:
    # Prebuilt image from GitHub Container Registry (built by .github/workflows/docker.yml).
    # To build locally instead, comment out `image` and keep `build`.
    image: ghcr.io/broemp/stickerer:main
    build: .
    container_name: stickerer
    ports:
      - "${PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
