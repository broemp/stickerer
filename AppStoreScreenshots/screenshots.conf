# What make-screenshots.sh captures. Change shots, captions and the video here — no code edits.
# Every value can be overridden per run, e.g.  DEVICES=ipad ./make-screenshots.sh

DEVICES="${DEVICES:-iphone ipad}"   # iphone, ipad, or both
LOCALES="${LOCALES:-en-US}"         # captions below are for en-US; see captions/<locale>.strings
APPEARANCE="${APPEARANCE:-dark}"    # the app forces dark mode; keeps the simulator chrome consistent
SCREEN_WAIT="${SCREEN_WAIT:-3}"     # seconds between launch and capture (all data is offline demo data)

# Simulator models (created on first run as clean "Stickerer Screenshots …" simulators).
IPHONE_SIM_TYPE="${IPHONE_SIM_TYPE:-iPhone 18 Pro Max}"  # 6.9", 1320x2868
IPAD_SIM_TYPE="${IPAD_SIM_TYPE:-iPad Pro 13-inch (M5)}"   # must be a 13" iPad

# Screenshots, in App Store order:  "<file name> | <caption> | <scene>"
# Scenes are played by Stickerer/ScreenshotMode.swift (debug builds only):
#   home        a tweet link pasted in, library below
#   converting  the spinning cat while a video is converted
#   pack        a 4-sticker pack, ready for "Add to WhatsApp"
#   library     every sticker ever made, tap to re-use (video tour only: as a still it looks like `home`)
#   split       one clip split into 3 stickers
# Empty scene = not captured: a hand-made <file name>.png in
# appstore-frames/fastlane/screenshots/<locale>/ is kept and framed (e.g. the iOS share sheet).
SCREENS=(
  "01-paste      | Paste a tweet, get a sticker     | home"
  "02-converting | Converted right on your iPhone   | converting"
  "03-pack       | Animated stickers for WhatsApp   | pack"
  "04-split      | One clip, three stickers         | split"
  "05-share      | Share straight from X            | "
)

# Captions for further locales (the app UI is English-only for now): captions/<locale>.strings with lines like
#   "01-paste" = "Tweet einfügen, Sticker erhalten";
# A locale without that file reuses the captions above.

# The App Store preview video: scenes with waits. Length = sum of the waits minus PREVIEW_LEAD,
# and App Store Connect requires 15–30 s. Recording starts PREVIEW_LEAD seconds after launch.
PREVIEW_LEAD="${PREVIEW_LEAD:-3}"
PREVIEW_STEPS="${PREVIEW_STEPS:-
  home;       wait:6;
  converting; wait:5;
  pack;       wait:5;
  split;      wait:4;
  library;    wait:5
}"
